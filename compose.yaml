services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: runtime
    environment:
      ACL_JUDGE: ${ACL_JUDGE:-demo}
      ACL_POLICY: /app/policy/policy.yaml
      ACL_AUDIT: /app/gateway/data/audit.jsonl
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./policy:/app/policy   # writable: the Policies page can change a control's action (POST /api/policy/controls/{id}, localhost only)
      - audit-data:/app/gateway/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The security team's signature feed (`just feed`): serves feeds/signatures.json on 127.0.0.1:8100 inside the
  # gateway's network, so the policy's feed_url works unchanged. Edit feeds/signatures.json and press "Pull feed now".
  feed:
    image: python:3.13-slim
    network_mode: service:gateway
    command: python -m http.server 8100 --bind 127.0.0.1 --directory /feeds
    volumes:
      - ./feeds:/feeds:ro
    depends_on:
      - gateway
    restart: unless-stopped

  dashboard:
    # Keep the gateway's localhost-only /api/try demo protected: the dashboard
    # reaches it over loopback rather than weakening the API's local-client check.
    network_mode: service:gateway
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      BACKEND_URL: http://127.0.0.1:8000
      ACL_MODEL: ${ACL_MODEL:-mock/compromised}
      ACL_KEY: ${ACL_KEY:-acl_dev_alice_6e6b08d7f51bc504a3073311}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Hot-reload dashboard for design work, no Node on the host needed. It takes port 3000 in the gateway's network,
  # so stop the built one first: `docker compose stop dashboard && docker compose --profile dev up -d dashboard-dev`.
  dashboard-dev:
    profiles: ["dev"]
    image: node:22-bookworm-slim
    network_mode: service:gateway
    working_dir: /app
    command: sh -c "{ cmp -s package-lock.json node_modules/.package-lock.json || npm ci --no-audit --no-fund; } && npx next dev -H 0.0.0.0 -p 3000"
    environment:
      BACKEND_URL: http://127.0.0.1:8000
      ACL_MODEL: ${ACL_MODEL:-mock/compromised}
      ACL_KEY: ${ACL_KEY:-acl_dev_alice_6e6b08d7f51bc504a3073311}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_POLL_MS: 1000   # file events don't cross the Windows bind mount (next.config.ts)
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
      - dashboard-next:/app/.next
    depends_on:
      gateway:
        condition: service_healthy


  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: test

volumes:
  audit-data:
  dashboard-node-modules:
  dashboard-next:
