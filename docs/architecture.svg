<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="1552" y="1521">Attachment-aware classification</tspan><tspan x="1552" y="1547">Verify against source of truth</tspan><tspan x="1552" y="1573">Security dashboard + agent-flow UI</tspan><tspan x="1552" y="1599">Expand YAML control test cases</tspan></text>
