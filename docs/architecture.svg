<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="82" y="486">demo/agent.py • OpenAI SDK</tspan><tspan x="82" y="512">Bearer key → user + agent</tspan><tspan x="82" y="538">X-Purpose + X-Session</tspan><tspan x="82" y="564">POST /v1/chat/completions</tspan><tspan x="82" y="590">Tools + results in chat history</tspan></text>
<rect x="60" y="730" width="400" height="190" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
