<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1760" viewBox="0 0 2040 1760"><title>PIKA / AI Control Layer architecture</title><desc>Implemented model-proxy runtime, policy and session state, agent-executed demo tools, persistent audit reporting, and a separate planned roadmap.</desc><rect width="2040" height="1760" fill="white"/><defs><marker id="1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker><marker id="1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1971c2" stroke-width="1.5"/></marker><marker id="087f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#087f5b" stroke-width="1.5"/></marker><marker id="b86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b86e00" stroke-width="1.5"/></marker><marker id="c92a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c92a2a" stroke-width="1.5"/></marker><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><text fill="#1e293b" font-family="Arial, sans-serif" font-size="44"><tspan x="60" y="79">PIKA / AI Control Layer</tspan></text>
<text fill="#64748b" font-family="Arial, sans-serif" font-size="22"><tspan x="60" y="117">Architecture • main @ 2ca033c + local demo integration • 03 October 2026</tspan></text>
<text fill="#64748b" font-family="Arial, sans-serif" font-size="20"><tspan x="1510" y="72">Solid = implemented</tspan><tspan x="1510" y="98">Dashed / amber = planned</tspan></text>
