<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="82" y="1521">Request signing / roster sync</tspan><tspan x="82" y="1547">Agent hierarchy; delegation narrows</tspan><tspan x="82" y="1573">Time-bound access and information</tspan><tspan x="82" y="1599">barriers / sensitive HR data</tspan></text>
