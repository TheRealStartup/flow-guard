<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="1552" y="931">Compose: mock model + DemoJudge</tspan><tspan x="1552" y="957">No keys required; keyword checks</tspan><tspan x="1552" y="983">Live Jev uses redacted text only</tspan></text>
<rect x="60" y="1050" width="400" height="200" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text fill="#c92a2a" font-family="Arial, sans-serif" font-size="24"><tspan x="82" y="1092">Current enforcement boundary</tspan></text>
<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="82" y="1131">API keys authenticate the client.</tspan><tspan x="82" y="1157">Reporting APIs have no auth.</tspan><tspan x="82" y="1183">Agent still sees raw tool data.</tspan><tspan x="82" y="1209">Direct actions can bypass proxy.</tspan><tspan x="82" y="1235">MCP / managed egress: planned.</tspan></text>
<rect x="570" y="1050" width="830" height="215" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="1.5"/>
<text fill="#087f5b" font-family="Arial, sans-serif" font-size="24"><tspan x="592" y="1092">Audit + telemetry • exchanges + identity denials</tspan></text>
<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="592" y="1131">Hash-chained JSONL on persistent audit-data volume</tspan><tspan x="592" y="1157">User / agent / purpose + policy hash; blocked identity attempts</tspan><tspan x="592" y="1183">Outcomes, decisions, per-check latency + cumulative usage</tspan><tspan x="592" y="1209">Allowed tool proposals do not prove execution or success</tspan><tspan x="592" y="1235">GET /api/metrics • /api/events • /api/audit/verify|export</tspan></text>
