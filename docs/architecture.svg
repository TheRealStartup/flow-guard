<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="592" y="251">policy.yaml + identities.yaml</tspan><tspan x="592" y="277">signatures.json; mtime reload</tspan><tspan x="592" y="303">Profiles; last good policy on error</tspan></text>
<rect x="1020" y="170" width="380" height="140" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="1.5"/>
<text fill="#087f5b" font-family="Arial, sans-serif" font-size="24"><tspan x="1042" y="212">Session state • in memory</tspan></text>
<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="1042" y="251">User, agent, purpose + budgets</tspan><tspan x="1042" y="277">Token vault, labels + quarantine</tspan><tspan x="1042" y="303">Memory only; resets on restart</tspan></text>
<rect x="530" y="335" width="910" height="605" rx="12" fill="#f8fbff" stroke="#1971c2" stroke-width="1.5"/>
<text fill="#1971c2" font-family="Arial, sans-serif" font-size="25"><tspan x="558" y="373">FastAPI gateway :8000 • shared policy engine</tspan></text>
<rect x="570" y="405" width="830" height="200" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<text fill="#1971c2" font-family="Arial, sans-serif" font-size="24"><tspan x="592" y="447">1  Identity + request checks → sanitized input</tspan></text>
<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="592" y="486">Bearer key → user / agent; purpose required; session owner checked</tspan><tspan x="592" y="512">Model allowlist + session budgets + signature checks</tspan><tspan x="592" y="538">PII / secrets → reversible tokens (regex + checksums)</tspan><tspan x="592" y="564">New prompts / tool results → judge after redaction</tspan><tspan x="592" y="590">Judge: offline DemoJudge OR external Jev (TypeSafe)</tspan></text>
<rect x="570" y="690" width="830" height="215" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="1.5"/>
<text fill="#087f5b" font-family="Arial, sans-serif" font-size="24"><tspan x="592" y="732">2  Response checks → permitted actions</tspan></text>
<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="592" y="771">Role → allowed tools; signatures on tool arguments</tspan><tspan x="592" y="797">Sensitive data → external sink: block by policy</tspan><tspan x="592" y="823">Tool-call budgets; detokenize only for allowed sinks</tspan><tspan x="592" y="849">Redact model text; remove blocked tool calls</tspan><tspan x="592" y="875">Update token / cost / local-compute usage</tspan></text>
<rect x="60" y="405" width="400" height="200" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
