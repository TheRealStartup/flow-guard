<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="82" y="811">get_customer → fake bank records</tspan><tspan x="82" y="837">send_email → local JSONL outbox</tspan><tspan x="82" y="863">charge_card → simulated payment</tspan><tspan x="82" y="889">No MCP server in current MVP</tspan></text>
