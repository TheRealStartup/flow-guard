<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="1552" y="1131">Current: reporting API + UI links</tspan><tspan x="1552" y="1157">Planned: flow view, blocked-access</tspan><tspan x="1552" y="1183">review, alerts and policy management</tspan><tspan x="1552" y="1209">/api/events is JSON; SSE is planned</tspan></text>
<polyline points="1405,1130 1525,1130" fill="none" stroke="#087f5b" stroke-width="2" marker-end="url(#087f5b)"/>
<text fill="#b86e00" font-family="Arial, sans-serif" font-size="30"><tspan x="60" y="1360">Product direction • from the planning doc and repository backlog</tspan></text>
<text fill="#64748b" font-family="Arial, sans-serif" font-size="21"><tspan x="60" y="1401">These capabilities are proposed; they are not part of the working runtime above.</tspan></text>
