<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="1552" y="486">mock/compromised • offline script</tspan><tspan x="1552" y="512">Ollama • local, optional profile</tspan><tspan x="1552" y="538">OpenRouter • external, optional</tspan><tspan x="1552" y="564">Only policy-allowed models</tspan><tspan x="1552" y="590">Non-streaming Chat Completions</tspan></text>
