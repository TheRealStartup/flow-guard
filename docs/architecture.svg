<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="1062" y="1521">Second-person approval</tspan><tspan x="1062" y="1547">Bind approval to exact argument hash</tspan><tspan x="1062" y="1573">Request access + review workflow</tspan><tspan x="1062" y="1599">No approval action implemented yet</tspan></text>
