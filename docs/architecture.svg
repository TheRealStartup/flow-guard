<text fill="#1e293b" font-family="Arial, sans-serif" font-size="20"><tspan x="572" y="1521">MCP gateway + harness hooks</tspan><tspan x="572" y="1547">Inspect actual tool effects</tspan><tspan x="572" y="1573">Managed egress / client configuration</tspan><tspan x="572" y="1599">Additional API adapters + streaming</tspan></text>
