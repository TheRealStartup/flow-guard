# AI Control Layer: the single source of truth for every control.
# Re-read automatically when this file changes; no restart needed. Every audit entry
# records `version` + a hash of this file, so you can see which policy made a decision. Documented in docs/policy.md.
version: "0.2"

# strict | balanced | permissive. Profiles override the controls below (see `profiles`).
active_profile: balanced

defaults:
  on_error: block            # if a check fails or times out: block (fail closed) | allow (fail open)

# Actions, from weakest to strongest:
#   allow   control is off
#   flag    let it through, but record it in the audit log
#   redact  replace the sensitive part (PII/secrets → reversible tokens; injected text → quarantined)
#   block   stop the request / drop the tool call

controls:
  models.allowlist:   {action: block}
  budget:             {action: block}
  pii.card:           {action: redact}    # regex + Luhn checksum
  pii.iban:           {action: redact}
  pii.pesel:          {action: redact}    # Polish national ID, with checksum
  pii.passport:       {action: redact}    # passport numbers, where the text labels them
  barrier.mnpi:       {action: redact}    # information barrier: redact = withhold restricted results from the wrong side
  access.scope:       {action: block}     # tool arguments limited to the user's own scope (e.g. assigned clients)
  access.datalake:    {action: block}     # data lake: named queries only, refused before they run (see datalake)
  secrets:            {action: redact}    # API keys, private keys
  signatures:         {action: block, feed: signatures.json}
  access.tools:       {action: block}     # role → allowed tools
  flow.sensitive_to_external:
    action: block
    mode: value       # value: block only if the call carries sensitive data | session: block any external call once the session holds sensitive data
  injection.jev:
    action: redact    # redact = quarantine the suspicious message; block = stop the whole request
    threshold: 0.80   # Jev's probability that the text tries to instruct the agent
    timeout_s: 8       # Jev answers in 0.6–0.8 s (measured Sat night; 2–4.5 s earlier that day)
    on_error: block
    max_class: internal  # Jev is an external service (api.typesafe.ai): it never receives P2/DP30 (see classification)
  spotlight:          # tool results reach the model inside <<tool_data id=…>> markers + a note: data, not instructions
    action: flag      # if tool data fakes our marker to break out of the block: flag | block (it is escaped either way)
    mode: delimit     # delimit | off

profiles:
  strict:
    spotlight: {action: block}
    secrets: {action: block}
    flow.sensitive_to_external: {mode: session}
    injection.jev: {threshold: 0.50, action: block}
  balanced: {}
  permissive:
    pii.iban: {action: flag}
    pii.pesel: {action: flag}
    injection.jev: {threshold: 0.95, action: flag, on_error: allow}

# Allowed models and where they run. Prices are USD per million tokens, used only if
# the provider does not report the cost itself. Local models cost $0 but use compute time.
models:
  deepseek/deepseek-v4.1-flash: {upstream: openrouter, input_per_m: 0.10, output_per_m: 0.30}
  qwen3:4b:                     {upstream: ollama}
  mock/compromised:             {upstream: mock}   # scripted model that obeys injected instructions (demo + tests)

budgets:
  session:
    max_tokens: 60000
    max_cost_usd: 0.05
    max_tool_calls: 20
    max_compute_seconds: 300

# Who is calling (US-1.2). api_key: every request presents a key (Authorization: Bearer) that maps to one
# (user, agent) pair in identities.yaml; no key = denied, and the agent gets exactly that user's role.
# header: trust the X-User header (local development only; anyone can claim to be anyone).
identity:
  mode: api_key
  keys_file: identities.yaml
  require_purpose: true     # every request states why (X-Purpose header); recorded in the audit log

# What each user's role may do.
users:
  alice:  {role: support_junior}
  bob:    {role: fraud_analyst}
  olivia: {role: onboarding_analyst, side: public, assigned_clients: [NW-2041]}   # onboarding scenario
  marcus: {role: mna_banker, side: private, deals: [falcon]}                      # onboarding scenario
  devon:  {role: developer}                                                       # developer scenario (stub)
roles:
  support_junior:     {tools: [get_customer, send_email]}
  fraud_analyst:      {tools: [get_customer, send_email, charge_card]}
  onboarding_analyst: {tools: [get_client_file, screen_sanctions, search_documents, query_datalake, send_email]}
  mna_banker:         {tools: [search_documents, query_datalake, send_email]}
  developer:                                   # devon's scripted agent and Claude Code (the capitalised names)
    tools: [list_files, read_file, run_tests, http_post, Read, Glob, Grep, Edit, Write, Bash, WebFetch, TodoWrite]
    budget: {max_tokens: 2000000, max_compute_seconds: 1800}   # Claude Code sends ~16k tokens per request
  default:            {tools: []}

# Information barriers (US-1.3). Content naming a restricted deal is withheld from anyone not on that deal,
# with a reply that does not confirm the deal exists. Nobody, not even the deal team, may send it outside.
barriers:
  public_message: "Some results are outside your access."
  restricted:
    - {id: falcon, class: DP30, terms: ["Project Falcon", "Kestrel Dynamics", "KSTL"]}

# Limits on tool arguments: a tool may only be called for things inside the user's own scope.
scopes:
  get_client_file: {argument: client_id, user_field: assigned_clients}

sinks:
  external: [send_email, http_post, WebFetch]      # data leaves the organisation here
  detokenize: [charge_card, screen_sanctions]      # real values are put back only for these tools

# Shell commands that send data out (Claude Code has no http_post: it runs curl in Bash). A matching command to a
# host outside allow_hosts counts as an external sink, so flow.sensitive_to_external decides on it.
egress:
  tools: {Bash: command}                           # tool -> the argument that holds the shell command
  patterns: ['\b(curl|wget|nc|ncat|scp|rsync|ftp)\b']
  allow_hosts: [localhost, 127.0.0.1, pypi.org, files.pythonhosted.org]

# Data classes (P2/DP30, issue #13), lowest first. Before any model or judge sees a message, it gets a class from a
# trusted source: the tool that returned it (tools below; a tool not listed here is unclassified) or a restricted term
# it names (barriers above), or for the data lake the named query that ran (datalake below). Tokenising identifiers never lowers it. Content above a destination's limit is withheld
# with the neutral barrier message (action: redact) or stops the request (action: block). Limits: max_to_model for
# every model, a model's own `max_class` below that, and `max_class` on injection.jev for the external judge. A tool
# result that may reach the model but not Jev cannot be injection-checked, so that request is blocked.
classification:
  levels: [public, internal, P2, DP30]
  max_to_model: P2
  default: internal                  # user, system and assistant text that names no restricted term
  action: redact
  tools:
    get_customer: internal           # card and IBAN are tokens by the time the model sees them
    send_email: internal
    charge_card: internal
    get_client_file: P2              # client onboarding file (owners, documents, settlement account)
    screen_sanctions: internal
    search_documents: internal       # restricted deal documents in it are DP30 by their terms
    list_files: internal
    read_file: internal
    run_tests: internal
    http_post: internal
    Read: internal
    Glob: internal
    Grep: internal
    Edit: internal
    Write: internal
    Bash: internal
    WebFetch: internal
    TodoWrite: internal

# Data lake. The agent never writes a query: it names one from this catalog. A query the user's role may not run, or
# whose result could not be sent on (to the model, and to Jev while the AI check is on), is refused before it runs,
# with the same neutral reason in every case. Each result carries the lake's own class label; a missing label or one
# that differs from the class here leaves the result unclassified, so it is withheld. A lower-class view of a dataset
# exists only as a transformation listed here: the deal team's agent may see how many live deals each sector has
# (groups under min_group suppressed), never the deals. The public side gets nothing from the pipeline: even a count
# of pending deals is MNPI to them.
datalake:
  tool: query_datalake
  argument: query
  datasets:                                          # synthetic data: demo/datalake.py
    fx_reference:     {class: public}
    client_positions: {class: P2}
    deal_pipeline:    {class: DP30}
  transformations:
    sector_counts:    {class: internal, from: deal_pipeline, count_by: sector, min_group: 3}
  queries:
    fx_rates:           {dataset: fx_reference,         roles: [onboarding_analyst, mna_banker]}
    client_positions:   {dataset: client_positions,     roles: [onboarding_analyst]}
    deal_pipeline:      {dataset: deal_pipeline,        roles: [mna_banker]}
    pipeline_by_sector: {transformation: sector_counts, roles: [mna_banker]}
