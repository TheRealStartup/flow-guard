[project]
name = "acl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "watchfiles",
    "fastmcp",
    "prometheus-client",
    "python-dotenv",
    "openai",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["../tests"]
